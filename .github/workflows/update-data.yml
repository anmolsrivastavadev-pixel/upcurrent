name: Update data and publish

on:
  schedule:
    - cron: "11,41 * * * *" # twice an hour, so a delayed or skipped run is covered
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch sources
        run: node scripts/update-data.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a Reddit "script" app lets the job read Reddit through its official API.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          # Optional: an X API bearer token (paid X developer plan) adds posts from X.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Optional: a Bluesky handle + app password (free) for Bluesky search.
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # Optional news and launch sources. Each one switches on when its key is added.
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}

      - name: Build the email preview page
        # Writes data/digest.md for email.html. With no Buttondown key it never sends anything.
        run: node scripts/digest.cjs
        env:
          BUTTONDOWN_API_KEY: ""

      - name: Count newsletter readers
        # Real subscriber and open counts for the signup boxes (data/api/newsletter.json). Reads only.
        continue-on-error: true
        run: node scripts/newsletter-stats.cjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/api
          git diff --cached --quiet && exit 0
          git commit -m "Update data"
          # Another commit can land on main while this run is fetching (a code push, or an
          # overlapping run). Rebase onto it and retry instead of failing the whole publish.
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || { git rebase --abort; echo "Could not save data this time; the next run will."; exit 0; }
          done
          exit 1

      - name: Build search-engine pages
        # Daily archive pages, sitemap.xml and a pre-filled index.html for the published copy only.
        # Never blocks the publish: if anything here fails, the site goes out as before.
        continue-on-error: true
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$CHROME" ]; then
            TZ=Europe/London timeout 90 "$CHROME" --headless=new --no-sandbox --disable-gpu --lang=en-US \
              --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8080/ > "$RUNNER_TEMP/rendered.html" 2>/dev/null || true
          fi
          if [ -s "$RUNNER_TEMP/rendered.html" ]; then
            node scripts/build-seo.cjs --prerender "$RUNNER_TEMP/rendered.html"
          else
            node scripts/build-seo.cjs
          fi
          # Today's share card (top 3 rising) for Discord, X, iMessage etc. Keeps og.png if it fails.
          [ -n "$CHROME" ] && node scripts/og-image.cjs "$CHROME" || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub sometimes says the just-uploaded site "isn't there yet" (No artifacts named
      # github-pages). That's on GitHub's side, so wait a moment and try once more.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Tell search engines about new pages
        continue-on-error: true
        run: node scripts/indexnow.cjs
