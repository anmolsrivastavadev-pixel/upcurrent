name: Morning email

on:
  schedule:
    - cron: "5,35 * * * *" # twice an hour; each subscriber gets it once, at 7am their time (or the next run before noon if GitHub was late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check who is due and test the filter, don't send"
        type: boolean
        default: true
      only_tz:
        description: "Send now to one time zone only (e.g. Europe/London), ignoring the 7am rule"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: morning-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and send the digest
        run: node scripts/digest.cjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_TZ: ${{ inputs.only_tz }}

      - name: Show the email
        if: always()
        run: cat data/digest.md >> "$GITHUB_STEP_SUMMARY"
