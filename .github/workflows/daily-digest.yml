name: Morning email

on:
  schedule:
    - cron: "5,35 * * * *" # twice an hour; each subscriber gets it once, at 7am their time (or the next run before noon if GitHub was late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check who is due and test the filter, don't send"
        type: boolean
        default: true
      only_tz:
        description: "Send now to one time zone only (e.g. Europe/London), ignoring the 7am rule"
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: morning-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Unstick the site publish
        # On 6 Oct a publish run sat "waiting" for the github-pages environment for a day, and on 9 Nov one
        # sat "in progress" for 4 days; both froze the site. A normal publish takes 1-3 minutes, so any
        # "Update data" run still waiting, queued or in progress after 45 minutes is cancelled.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for st in waiting queued in_progress; do
            gh api "repos/${{ github.repository }}/actions/workflows/update-data.yml/runs?status=$st&per_page=20" \
              --jq '.workflow_runs[] | select((now - (.run_started_at | fromdateiso8601)) > 2700) | .id' |
            while read -r id; do echo "::warning::Cancelling stuck publish run $id ($st for over 45 minutes)"; gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true; done
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and send the digest
        run: node scripts/digest.cjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_TZ: ${{ inputs.only_tz }}

      - name: Send free model alerts
        # Once a day, 8am-noon UTC, to people who signed up for alerts. Never blocks the email.
        continue-on-error: true
        run: node scripts/free-alerts.cjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Post the top 3 to Bluesky and Mastodon
        # Once a day, 8am-1pm UK. Skips any network without secrets and never blocks the email.
        continue-on-error: true
        run: node scripts/social-post.cjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Show the email
        if: always()
        run: cat data/digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check the site is still updating
        # If the published data is over 3 hours old, fail this run so GitHub emails a failure notice.
        # Only on the runs in the first 20 minutes of 00:00, 06:00, 12:00 and 18:00 UTC, so a long
        # outage sends a few warnings a day, not one every 15 minutes.
        if: always()
        run: |
          age=$(( $(date +%s) - $(date -d "$(node -p 'require("./data/api/today.json").about.updated')" +%s) ))
          echo "Published data is $((age / 60)) minutes old"
          if [ "$age" -gt 10800 ]; then
            msg="Upcurrent has not updated for $((age / 3600)) hours. Check the Update data runs in the Actions tab."
            echo "::warning::$msg"
            if [ $(( 10#$(date -u +%H) % 6 )) -eq 0 ] && [ $(( 10#$(date -u +%M) )) -lt 20 ]; then echo "::error::$msg"; exit 1; fi
          fi
