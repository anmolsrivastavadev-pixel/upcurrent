name: Morning email

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the preview, don't send"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and send the digest
        run: node scripts/digest.cjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Show the email
        if: always()
        run: cat data/digest.md >> "$GITHUB_STEP_SUMMARY"
