name: Morning email

on:
  schedule:
    - cron: "5,35 * * * *" # twice an hour; each subscriber gets it once, at 7am their time (or the next run before noon if GitHub was late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check who is due and test the filter, don't send"
        type: boolean
        default: true
      only_tz:
        description: "Send now to one time zone only (e.g. Europe/London), ignoring the 7am rule"
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: morning-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unstick the site publish
        # On 6 Oct a publish run sat "waiting" for the github-pages environment for a day and froze the site.
        # Any "Update data" run still waiting after 45 minutes is cancelled so the next one can go out.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/update-data.yml/runs?status=waiting&per_page=20" \
            --jq '.workflow_runs[] | select((now - (.run_started_at | fromdateiso8601)) > 2700) | .id' |
          while read -r id; do echo "Cancelling stuck run $id"; gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and send the digest
        run: node scripts/digest.cjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_TZ: ${{ inputs.only_tz }}

      - name: Post the top 3 to Bluesky and Mastodon
        # Once a day, 8am-1pm UK. Skips any network without secrets and never blocks the email.
        continue-on-error: true
        run: node scripts/social-post.cjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

      - name: Show the email
        if: always()
        run: cat data/digest.md >> "$GITHUB_STEP_SUMMARY"
